name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the version in Cargo.toml after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check registry credential is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret."
            exit 1
          fi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check lints
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Test release build
        run: cargo +stable test --release --locked
      - name: Verify package without uploading
        run: cargo +stable publish --dry-run --locked --registry crates-io
      - name: Publish verified version
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --locked --registry crates-io
