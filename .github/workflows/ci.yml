name: Rust checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --locked
      - run: cargo +${{ matrix.toolchain }} test --release --locked
      - run: cargo +${{ matrix.toolchain }} doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf,wasm32-unknown-unknown
      - run: cargo +stable build --lib --target thumbv7em-none-eabihf --locked
      - run: cargo +stable build --lib --target wasm32-unknown-unknown --locked
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test --test contracts --locked
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --manifest-path benchmarks/Cargo.toml --locked
